[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodtimizer"
version = "0.1.0"
description = "Linear-programming optimizer for daily nutrition plans based on macro targets."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joel" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sqlalchemy>=2.0"]
llm = ["openai>=1.0"]
app = ["streamlit>=1.42", "pandas>=2.0"]
# Cloud deployment (e.g. Streamlit Community Cloud) with a hosted database
# and multi-user OIDC sign-in (Authlib powers st.login).
cloud = [
    "streamlit>=1.42",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "authlib>=1.3.2",
]

[project.scripts]
foodtimizer = "foodtimizer.cli:main"
foodtimizer-anchors = "foodtimizer.suggest:main"
foodtimizer-track = "foodtimizer.track_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
