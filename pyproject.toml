[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodtimizer"
version = "0.1.0"
description = "Linear-programming optimizer for daily nutrition plans based on macro targets."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joel" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "sqlalchemy>=2.0"]
llm = ["openai>=1.0"]
app = ["streamlit>=1.42,<1.61", "pandas>=2.0"]
# Cloud deployment (e.g. Streamlit Community Cloud) with a hosted database
# and multi-user OIDC sign-in (Authlib powers st.login). Streamlit is capped
# below 1.61 to avoid a startup crash from its gzip middleware being
# incompatible with newer Starlette (missing `thread_minimum_size`).
cloud = [
    "streamlit>=1.42,<1.61",
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "authlib>=1.3.2",
]
# Phone API. Not installed by Streamlit Cloud (that uses requirements.txt).
# Install with: pip install -e ".[api]"
# Starlette stays on 1.3.1, the version the Streamlit tracker is pinned to.
# A newer Starlette crashes Streamlit 1.59 at startup, so installing the API
# in the same environment must not upgrade it. FastAPI 0.135+ accepts that pin.
api = [
    "fastapi>=0.135,<0.144",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "starlette==1.3.1",
]

[project.scripts]
foodtimizer = "foodtimizer.cli:main"
foodtimizer-anchors = "foodtimizer.suggest:main"
foodtimizer-track = "foodtimizer.track_launcher:main"
foodtimizer-api = "foodtimizer.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
